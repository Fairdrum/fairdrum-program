[toolchain]
anchor_version = "1.2.2"
# pinned explicitly: otherwise avm takes a number from Cargo.lock and asks for a Solana release that does not exist
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
fairdrum = "5ww3w4HrQrrrPcjfxVRvjLpL5vBJqLt7M5ThsnEkkngf"

[programs.localnet]
fairdrum = "5ww3w4HrQrrrPcjfxVRvjLpL5vBJqLt7M5ThsnEkkngf"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
