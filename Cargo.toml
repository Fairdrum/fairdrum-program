[workspace]
members = ["programs/fairdrum"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# For a verifiable build (solana-verify): the Solana/Agave version you build with. Must match `solana --version`.
[workspace.metadata.cli]
solana = "3.1.10"
