[package]
name = "fairdrum"
version = "0.1.0"
description = "FAIRDRUM: an open drum game on Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "fairdrum"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = "=1.2.2"
solana-sha256-hasher = "=3.1.0"
# Randomness needs no external crate: the round number is sha256(house secret, hash of the bet's block), see src/math.rs.

# Only for the Solana build (cargo-build-sbf): getrandom is pulled in transitively
# (anchor-spl → solana-zk-sdk → aes-gcm-siv → rand_core) and does not build for the SBF target
# without the "custom" feature. The contract does not use operating-system randomness: if called, such a
# getrandom would return an error, not weak randomness. It does not affect ordinary tests.
[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-heap","custom-panic","anchor-debug"))',
] }
